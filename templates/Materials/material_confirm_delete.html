{% extends 'based/base.html' %}

{% block title %}Підтвердження видалення{% endblock %}

{% block content %}
<div class="container mt-5" style="max-width: 500px;">
    <div class="card shadow-sm p-4 rounded text-center">
        <h2 class="mb-3 text-danger">Підтвердження видалення</h2>
        <p>Ви впевнені, що хочете видалити матеріал? <strong>{{ object.material }}</strong></p>

        <form method="post" class="mt-4 d-flex justify-content-center gap-3">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger btn-lg rounded-pill">Так, видалити</button>
            <a href="{% url 'material-list' %}" class="btn btn-secondary btn-lg rounded-pill">Скасувати</a>
        </form>
    </div>
</div>

<style>
    .card {
        transition: transform 0.2s, box-shadow 0.2s;
    }
    .card:hover {
        transform: translateY(-3px);
        box-shadow: 0 8px 20px rgba(0,0,0,0.15);
    }
</style>

{% endblock %}
