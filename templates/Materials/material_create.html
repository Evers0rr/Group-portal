{% extends 'based/base.html' %}
{% load static %}

{% block content %}
<div class="container mt-5" style="max-width: 600px;">
    <div class="card shadow-sm p-4 rounded">
        <h2 class="mb-4 text-center">Додати новий матеріал</h2>

        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}

            {{ form.as_p }}

            {% if form.non_field_errors %}
                <div class="alert alert-danger">
                    {{ form.non_field_errors }}
                </div>
            {% endif %}

            {% if form.errors %}
                <div class="alert alert-danger">
                    {{ form.errors }}
                </div>
            {% endif %}

            <div class="d-grid mt-3">
                <button type="submit" class="btn btn-primary btn-lg rounded-pill">💾 Зберегти</button>
            </div>
        </form>

        <p class="mt-3 text-center">
            <a href="{% url 'material-list' %}" class="btn btn-secondary rounded-pill">⬅️ Назад до списку матеріалів</a>
        </p>
    </div>
</div>

<style>
    .card {
        transition: transform 0.2s, box-shadow 0.2s;
    }
    .card:hover {
        transform: translateY(-3px);
        box-shadow: 0 8px 20px rgba(0,0,0,0.15);
    }
</style>

{% endblock %}
