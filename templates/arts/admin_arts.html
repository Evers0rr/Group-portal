{% extends "based/base.html" %}
{% block content %}

<div class="container mt-5">
    <h1 class="mb-4 text-center">Photo Gallery</h1>
    <div class="row g-4">
        {% for photo in photos %}
            {% if not photo.is_applied %}
            <div class="col-md-4">
                <div class="card shadow-sm rounded-3">
                    <img src="{{ photo.photo.url }}" class="card-img-top galeryPhoto" alt="фотографія">

                    <div class="card-body">
                        {% if photo.description %}
                        <p class="card-text">{{ photo.description }}</p>
                        {% endif %}
                        <p class="text-muted mb-2"><b>Owner:</b> {{ photo.owner.user.username }}</p>
                        <div class="d-flex justify-content-between">
                            <a href="{% url 'adminDelete' photo.id %}" class="btn btn-danger btn-sm rounded-pill action">🗑 Delete</a>
                            <a href="{% url 'adminAccept' photo.id %}" class="btn btn-success btn-sm rounded-pill">✅ Accept</a>
                        </div>
                    </div>
                </div>
            </div>
            {% endif %}
        {% endfor %}
    </div>
</div>

<script>
    const actions = document.querySelectorAll(".action");
    actions.forEach(action => {
        action.addEventListener("click", event => {
            const agree = confirm("Do you really want to delete this photo?");
            if (!agree) {
                event.preventDefault();
            }
        });
    });
</script>

<style>
    .galeryPhoto {
        height: 200px;
        object-fit: cover;
    }
</style>

{% endblock %}
