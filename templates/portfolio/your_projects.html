{% extends "based/base.html" %}
{% block content %}

<div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1>Projects list</h1>
        <a href="{% url 'create_project' %}" class="btn btn-success rounded-pill px-3 py-1">➕ Create project</a>
    </div>

    {% for project in projects %}
    <div class="card shadow-sm mb-3 p-3 rounded-3">
        <div class="d-flex justify-content-between align-items-start">
            <div>
                <h3><a href="{% url 'project' project.id %}">{{ project.title }}</a></h3>
                <p class="mb-1">{{ project.description }}</p>
                <small class="text-muted">Created: {{ project.time_add }} | Updated: {{ project.time_upd }}</small>
            </div>
            <div class="d-flex flex-column gap-2">
                <a href="{% url 'edit_project' project.id %}" class="btn btn-warning btn-sm rounded-pill">✏️ Edit</a>
                <a href="{% url 'delete_project' project.id %}" class="btn btn-danger btn-sm rounded-pill action">🗑 Delete</a>
            </div>
        </div>
    </div>
    {% endfor %}
</div>

<script>
    const actions = document.querySelectorAll(".action");
    actions.forEach(action => {
        action.addEventListener("click", event => {
            const agree = confirm("Do you know what you are doing?");
            if (!agree) {
                event.preventDefault();
            }
        });
    });
</script>

{% endblock %}
