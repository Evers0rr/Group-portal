{% extends "based/base.html" %}
{% block content %}

<div class="container mt-5">
    <div class="card shadow-lg p-4 rounded-3" style="max-width: 600px; margin: auto;">
        <h3 class="text-center mb-4">Додати медіа</h3>

        <form method="POST" enctype="multipart/form-data" action="{% url 'mediaAdd' project.id %}">
            {% csrf_token %}

            <div class="mb-3">
                {{ form.as_p }}
            </div>

            <div class="text-center">
                <button type="submit" class="btn btn-primary px-4 py-2 rounded-pill">
                    ➕ Додати
                </button>
            </div>
        </form>
    </div>
</div>

{% endblock %}
