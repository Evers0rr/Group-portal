{% extends "based/base.html" %}
{% block content %}

<div class="container mt-5">
    <div class="card shadow-lg p-4 rounded-3" style="max-width: 600px; margin: auto;">
        <h2 class="text-center mb-4">✏️ Редагування проекту</h2>

        <form method="POST" action="{% url 'edit_project' project.id %}">
            {% csrf_token %}

            <div class="mb-3">
                <label for="title" class="form-label">Назва проекту</label>
                <input type="text" class="form-control" id="title" name="title" value="{{ project.title }}" required>
            </div>

            <div class="mb-3">
                <label for="description" class="form-label">Опис</label>
                <textarea class="form-control" id="description" name="description" rows="3" required>{{ project.description }}</textarea>
            </div>

            <div class="text-center">
                <button class="btn btn-warning px-4 py-2 rounded-pill action" type="submit">
                    🔄 Зберегти зміни
                </button>
            </div>
        </form>
    </div>
</div>

<script>
    const actions = document.querySelectorAll(".action");
    actions.forEach(action => {
        action.addEventListener("click", event => {
            const agree = confirm("Do you know what you are doing?");
            if (!agree) {
                event.preventDefault();
            }
        });
    });
</script>

{% endblock %}
