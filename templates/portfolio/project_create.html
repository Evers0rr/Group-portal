{% extends "based/base.html" %}
{% block content %}

<div class="container mt-5">
    <div class="card shadow-lg p-4 rounded-3" style="max-width: 600px; margin: auto;">
        <h2 class="text-center mb-4">🚀 Створення проекту</h2>

        <form method="POST" action="{% url 'create_project' %}">
            {% csrf_token %}

            <div class="mb-3">
                <label for="title" class="form-label">Назва проекту</label>
                <input type="text" class="form-control" id="title" name="title" placeholder="Введіть назву" required>
            </div>

            <div class="mb-3">
                <label for="description" class="form-label">Опис</label>
                <textarea class="form-control" id="description" name="description" rows="3" placeholder="Короткий опис" required></textarea>
            </div>

            <div class="text-center">
                <button type="submit" class="btn btn-success px-4 py-2 rounded-pill">
                    ✅ Створити проект
                </button>
            </div>
        </form>
    </div>
</div>

{% endblock %}
